[project]
name = "ensayo"
version = "0.1.0"
description = "Prompt versioning + A/B testing with a real statistical test"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ensayo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
